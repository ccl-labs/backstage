name: Build and push Backstage image

on:
  push:
    branches:
      - master

env:
  IMAGE: ghcr.io/okccl/backstage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GitHub App トークン生成（platform-gitops への push 用）
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: okccl
          repositories: platform-gitops

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn tsc

      - run: yarn build:backend

      - name: GHCR ログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: イメージ build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: platform-gitops のイメージタグを更新
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/okccl/platform-gitops.git
          cd platform-gitops
          yq -i ".backstage.image.tag = \"sha-${SHA}\"" platform/backstage/values.yaml
          git config user.name "backstage-ci[bot]"
          git config user.email "backstage-ci[bot]@users.noreply.github.com"
          git add platform/backstage/values.yaml
          git commit -m "chore: backstage を sha-${SHA} に更新"
          git push
